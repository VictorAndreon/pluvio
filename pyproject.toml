[project]
name = "pluvio"
version = "0.1.0"
description = "Benchmark de previsão de chuva forte em Passo Fundo/RS + correção por ML"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy", "requests", "scikit-learn", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
